version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kopirise-backend
    restart: unless-stopped
    environment:
      - KOPIRISE_HOST=0.0.0.0
      - KOPIRISE_PORT=8080
      - KOPIRISE_ENV=production
      - KOPIRISE_DB_PATH=/app/data/kopirise.db
      - KOPIRISE_SESSION_SECRET=${KOPIRISE_SESSION_SECRET:-changeme_super_secret_64chars_minimum_value_here_12345}
      - KOPIRISE_CORS_ALLOWED_ORIGINS=${KOPIRISE_CORS_ALLOWED_ORIGINS:-https://kopirise.id,http://localhost:3000}
      - KOPIRISE_ARGON2_MEMORY=65536
      - KOPIRISE_ARGON2_ITERATIONS=3
      - KOPIRISE_ARGON2_PARALLELISM=2
    volumes:
      - ./data:/app/data
    networks:
      - kopirise-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kopirise-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - KOPIRISE_API_URL=http://backend:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kopirise-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2.7-alpine
    container_name: kopirise-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - KOPIRISE_DOMAIN=${KOPIRISE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - kopirise-net

networks:
  kopirise-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
